version: 2.1

orbs:
  qlty: qltysh/qlty-orb@0.0
jobs:
  build:
    docker:
      - image: cimg/go:1.22

    steps:
      - checkout

      - restore_cache:
          keys:
            - go-mod-v2-{{ checksum "go.sum" }}

      - run: go get -t -v ./...

      - save_cache:
          key: go-mod-v2-{{ checksum "go.sum" }}
          paths:
            - "/home/circleci/go/pkg/mod"

      - run: go test $(go list ./... | grep -v /examples/) -race
      - run: go test $(go list ./... | grep -v /examples/) -coverprofile=c_raw.out
      - run:
          name: Remove mock and generated code
          command: |
            cat c_raw.out | grep -v main > c.out

      # Qlty Coverage Orb
      - qlty/coverage_publish:
          files: c.out
          format: coverprofile

